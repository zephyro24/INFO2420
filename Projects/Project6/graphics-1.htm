<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons</title>

<style type="text/css">
#thumbs, #image {
	width: 700px;
	border: solid 1px #000;
	text-align: center;
	margin: 0 auto;
	color: #000;
	background: #eee;
	padding: 5px;
}
#thumbs {
	margin-top: 10px;
}
#thumbs img {
	border: solid 1px #000;
	margin: 5px;
	cursor: pointer;
}
#image {
	height: 400px;
}
.instructions {
	font-style: italic;
}
#print, #logo {
	border: none;
}
.center {
	text-align: center;
	margin: 10px auto;
}
</style>

<script type="text/javascript">
var imgArray = [
	'image1Lg.png',
	'image2Lg.png',
	'image3Lg.png',
	'image4Lg.png'
];

var titleArray = [
	'Couple Biking', 
	'Couple Scuba Diving', 
	'Couple Snow Boarding', 
	'Couple Flyfishing'
];

var imgPath = "images/FullSize/";

function swapImage(imgID) {
	var theImage = document.getElementById('theImage');
	var textDiv  = document.getElementById('bottomText');

	theImage.src = imgPath + imgArray[imgID];
	textDiv.innerHTML = titleArray[imgID];
}

function preloadImages() {
	for (var i = 0; i < imgArray.length; i++) {
		var tmpImg = new Image();
		tmpImg.src = imgPath + imgArray[i];
	}
}
</script>
</head>

<body onload="preloadImages()">

<div class="center">
	<a href="javascript:window.print();"
	   onmouseover="document.getElementById('print').src='images/print2.png';"
	   onmouseout="document.getElementById('print').src='images/print1.png';">
		<img src="images/print1.png" alt="Print Page" width="200" height="50" id="print">
	</a>
</div>

<div class="center">
	<a href="#"
	   onmouseover="document.getElementById('logo').src='images/logo2.png';"
	   onmouseout="document.getElementById('logo').src='images/logo.png';">
		<img src="images/logo.png" alt="Logo" id="logo">
	</a>
</div>

<br>

<div id="thumbs">
	<img src="images/Thumbnails/image1Sm.png" alt="Image 1 thumbnail" onclick="swapImage(0)">
	<img src="images/Thumbnails/image2Sm.png" alt="Image 2 thumbnail" onclick="swapImage(1)">
	<img src="images/Thumbnails/image3Sm.png" alt="Image 3 thumbnail" onclick="swapImage(2)">
	<img src="images/Thumbnails/image4Sm.png" alt="Image 4 thumbnail" onclick="swapImage(3)">
</div>

<div id="image">
	<img id="theImage" src="images/FullSize/image1Lg.png" alt="Main image">
	<h3 id="bottomText">Newlyweds Sailing</h3>
</div>

<p style="text-align:center;">
	<a href="http://validator.w3.org/check?uri=referer">
		<img src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88">
	</a>
</p>

</body>
</html>
